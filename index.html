<style>
:root{--bg:#fff;--ink:#000;--mute:#5a5a5a;--line:#e3e3e3;--pk:#ff2e93;--panel:#f2f2f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}

*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 'Archivo',Arial,sans-serif}

.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:32px}

.th{display:flex;gap:10px;margin-top:10px}.th button{width:72px;aspect-ratio:4/5;background:var(--panel);border-radius:10px;overflow:hidden;border:2px solid transparent;display:grid;place-items:center}.th button.on{border-color:var(--ink)}

.acts{display:grid;gap:10px;margin:26px 0}.acts .btn{text-align:center}
details{border-top:1px solid var(--line);padding:14px 0}details:last-of-type{border-bottom:1px solid var(--line)}summary{font-weight:700;cursor:pointer}details p{color:var(--mute);margin-top:8px}

.post{border-top:1px solid var(--line);padding:26px 0;max-width:70ch}.post h3{font-size:26px;margin-bottom:6px}
.dk{background:#000;color:#fff}.dk .sub{color:#aaa}
.info a{display:block;font-size:clamp(20px,3vw,28px);font-weight:600;text-decoration:underline;text-underline-offset:5px;word-break:break-all;margin-bottom:10px}

.cp{max-width:1400px;margin:40px auto 0;border-top:1px solid #222;padding-top:20px;color:#888;font-size:14px}
dialog{border:0;border-radius:16px;padding:28px;max-width:440px;width:92%;background:var(--bg);color:var(--ink)}dialog::backdrop{background:rgba(0,0,0,.6)}
table{width:100%;border-collapse:collapse;margin:14px 0}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:#000;color:#fff;padding:14px 22px;border-radius:999px;font-weight:700;z-index:50;transition:transform .35s;border:1px solid var(--pk)}#toast.on{transform:translate(-50%,0)}
@media (max-width:620px){.grid{grid-template-columns:1fr 1fr;gap:28px 10px}.w{padding:56px 16px}}

.dots{display:flex;gap:5px;margin:4px 0}.dots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--line)}
.camp{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.cm{border-radius:14px;padding:48px 32px;min-height:380px;display:flex;flex-direction:column;justify-content:flex-end;gap:12px;align-items:flex-start;transition:transform .3s}.cm:hover{transform:translateY(-6px)}.cm p{max-width:28ch}
.soc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.soc a{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel);display:grid;place-items:center}.soc img{width:100%;height:100%;object-fit:cover;transition:transform .4s}.soc a:hover img{transform:scale(1.08)}.soc .shw{transform:scale(.6)}
body{overflow-x:clip;-webkit-tap-highlight-color:transparent}
.hero{min-height:86svh}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-right:-16px}.chips::-webkit-scrollbar,header nav::-webkit-scrollbar{display:none}.chips a{white-space:nowrap;flex:none}

@media (max-width:620px){

</style></head>
